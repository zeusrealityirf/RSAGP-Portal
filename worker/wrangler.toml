name = "rsagp-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://zeusrealityirf.github.io"
SITE_URL = "https://zeusrealityirf.github.io/RSAGP-Portal/"
# OAuth redirect URI must be https://<your Worker>/auth/callback
# DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, SUPREME_ADMIN_DISCORD_IDS: use wrangler secret put

[[d1_databases]]
binding = "DB"
database_name = "rsagp-db"
database_id = "efb47ba2-9d54-476f-8609-c5a36d38f366"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "rsagp-private-files"
